<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalBridge PH - Your Questions Answered</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #c9a961;
            --primary-dark: #b89850;
            --accent: #8ab4a6;
            --bg: #0a0e0d;
            --bg-elevated: #151b19;
            --card-bg: #1a2320;
            --text: #e8ebe9;
            --text-muted: #a0aea8;
            --text-dim: #6b7874;
            --border: #2a3532;
            --border-bright: #3a4542;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Background */
        .background-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(201, 169, 97, 0.02) 79px, rgba(201, 169, 97, 0.02) 80px),
                repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(201, 169, 97, 0.02) 79px, rgba(201, 169, 97, 0.02) 80px);
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.5rem 0;
            background: rgba(10, 14, 13, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main */
        main {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Hero */
        .hero {
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 2rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .stats span {
            color: var(--primary);
            font-weight: 600;
        }

        /* Controls - Minimalistic */
        .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        #searchInput {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3rem;
            font-size: 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.1);
        }

        #searchInput::placeholder {
            color: var(--text-dim);
        }

        /* Dropdown Filter */
        .filter-dropdown {
            position: relative;
        }

        #categorySelect {
            padding: 0.9rem 2.5rem 0.9rem 1rem;
            font-size: 0.95rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            min-width: 200px;
        }

        #categorySelect:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.1);
        }

        .filter-dropdown::after {
            content: '▼';
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            pointer-events: none;
            font-size: 0.8rem;
        }

        /* Results Info */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .results-count span {
            color: var(--primary);
            font-weight: 600;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Questions */
        .questions-grid {
            display: grid;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .question-card {
            background: var(--card-bg);
            transition: all 0.3s ease;
        }

        .question-header {
            padding: 1.5rem;
            cursor: pointer;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: start;
            transition: background 0.2s ease;
        }

        .question-header:hover {
            background: var(--bg-elevated);
        }

        .question-number {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(201, 169, 97, 0.1);
            border-radius: 8px;
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .question-main {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .question-text {
            font-family: 'Crimson Pro', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
        }

        .question-category {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .question-toggle {
            color: var(--primary);
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .question-card.active .question-toggle {
            transform: rotate(180deg);
        }

        .answer-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .question-card.active .answer-wrapper {
            max-height: 800px;
        }

        .answer-content {
            padding: 0 1.5rem 1.5rem;
            border-top: 1px solid var(--border);
        }

        .answer-text {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin: 1.5rem 0;
        }

        .legal-basis {
            background: rgba(201, 169, 97, 0.05);
            border-left: 3px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
        }

        .legal-basis-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .legal-basis-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 3rem;
        }

        .pagination-btn {
            padding: 0.7rem 1.2rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .page-info span {
            color: var(--primary);
            font-weight: 600;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .no-results-icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        .no-results h3 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        /* Scroll to top */
        .scroll-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 50%;
            color: var(--bg);
            font-size: 1.3rem;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-top:hover {
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            #categorySelect {
                min-width: 100%;
            }

            .question-header {
                grid-template-columns: 1fr auto;
            }

            .question-number {
                grid-column: 1 / -1;
                width: auto;
                justify-content: flex-start;
                padding: 0 0.5rem;
            }

            .results-info {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="background-effects"></div>

    <header>
        <div class="header-container">
            <div class="logo">LegalBridge PH</div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Your Questions Answered</h1>
            <p class="hero-subtitle">
                150 real-world legal questions from everyday Filipinos, answered in plain language with accurate 2026 legal bases.
            </p>
            <div class="stats">
                <span>150</span> questions · <span>16</span> categories · <span>100%</span> free
            </div>
        </section>

        <section class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search questions, answers, or legal bases..."
                    autocomplete="off"
                >
            </div>
            <div class="filter-dropdown">
                <select id="categorySelect">
                    <option value="">All Categories</option>
                </select>
            </div>
        </section>

        <div class="results-info">
            <div class="results-count">Showing <span id="resultsCount">150</span> of 150 questions</div>
            <button class="clear-btn" id="clearBtn">Clear filters</button>
        </div>

        <section class="questions-grid" id="questionsGrid"></section>

        <div class="pagination" id="pagination">
            <button class="pagination-btn" id="prevBtn">← Previous</button>
            <span class="page-info">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></span>
            <button class="pagination-btn" id="nextBtn">Next →</button>
        </div>
    </main>

    <button class="scroll-top" id="scrollTopBtn">↑</button>

    <script>
const legalQA = [
  {
    "id": 1,
    "question": "Bakit wala pa ring divorce sa Pinas hanggang ngayon?",
    "answer": "Walang absolute divorce law para sa non-Muslim Pinoys. May mga bill pa lang sa Congress pero hindi pa naipapasa (as of 2026). Kung foreigner ang spouse at nakapag-divorce na sila abroad, pwede kang magpa-recognize ng foreign divorce sa PH court para makapag-asawa ka ulit.",
    "basis": "Family Code; Art. 26 Family Code (recognition of foreign divorce); Fujiki v. Marinay, G.R. No. 196049 (2013)",
    "category": "Family Law"
  },
  {
    "id": 2,
    "question": "Pwede pa bang mag-file ng kaso kahit matagal nang nangyari?",
    "answer": "Depende: Civil cases (utang, damages) usually 10 years, criminal cases may iba-ibang limit (murder 20 years). Nullity of marriage walang limit. Check exact period para hindi ma-bar.",
    "basis": "Civil Code Arts. 1139–1155; Revised Penal Code Arts. 90–91",
    "category": "Family Law"
  },
  {
    "id": 3,
    "question": "May chismis sa FB na cheater ako, pwede ko ba kasuhan?",
    "answer": "Pwede kung siraan ka at nahihiya ka na (cyber libel). Kumuha ng screenshot + proof na ikaw tinutukoy. File sa PNP Cybercrime or prosecutor.",
    "basis": "RA 10175 (Cybercrime Act); Art. 353 RPC",
    "category": "Cybercrime"
  },
  {
    "id": 4,
    "question": "Legit ba yung lending apps na sobrang taas interest?",
    "answer": "Legit kung registered sa BSP/SEC, pero sobrang taas na interest (usurious) pwede void. Reklamo sa BSP kung abusive.",
    "basis": "RA 3765 (Truth in Lending); Civil Code Art. 1957",
    "category": "Debt & Obligations"
  },
  {
    "id": 5,
    "question": "Paano ko mapapaalis yung tenant na hindi nagbabayad?",
    "answer": "Magpadala ng demand letter + 15 days notice. Kung ayaw, file unlawful detainer sa MTC. Huwag sariliin ang eviction.",

    "category": "Property & Housing"
  },
  {
    "id": 6,
    "question": "May naka-park sa driveway namin, ano gagawin ko?",
    "answer": "Mag-demand in writing. Kung ayaw umalis, barangay complaint or nuisance case. Huwag mag-tow kung wala kang authority.",

    "category": "Barangay & Local"
  },
  {
    "id": 7,
    "question": "1 year na walang nangyari sa barangay, dismissed na ba?",
    "answer": "Hindi. Barangay conciliation requirement lang sa ilang cases. Kung walang settlement, bibigyan ka ng certificate para mag-file sa korte.",
    "basis": "RA 7160 (LGC) Secs. 399–422",
    "category": "Legal Process"
  },
  {
    "id": 8,
    "question": "Walang resibo pero sira yung binili ko, pwede pa ba reklamo?",
    "answer": "Pwede. Gamitin ang chat, bank transfer, pictures bilang proof. Reklamo sa DTI o small claims court.",
    "basis": "Civil Code Arts. 1305–1315 & 2176; RA 7394 (Consumer Act)",
    "category": "Legal Process"
  },
  {
    "id": 9,
    "question": "Namatay kamag-anak ko na may utang sa bank, kami ba magbabayad?",
    "answer": "Estate pays first. Family not personally liable unless co-signer. Life insurance usually safe from creditors.",
    "basis": "Civil Code Arts. 774 & 1311; Insurance Code Sec. 11",
    "category": "Family Law"
  },
  {
    "id": 10,
    "question": "Work from home pero walang SSS/13th month, ok lang ba?",

    "basis": "Labor Code Art. 295; DOLE D.O. 174-17",
    "category": "Labor & Employment"
  },
  {
    "id": 11,
    "question": "Ayaw tanggapin ng boss resignation ko, pwede ba?",

    "category": "Labor & Employment"
  },
  {
    "id": 12,
    "question": "Tinaguriang NPA ako sa TikTok, delikado ba 'to?",
    "answer": "Oo, red-tagging delikado. Pwede mag-file ng writ of amparo o harassment case. Reklamo sa CHR.",

    "category": "Cybercrime"
  },
  {
    "id": 13,
    "question": "CCTV lang ang proof, pwede ba akong tanggalin sa trabaho?",
    "answer": "CCTV pwede gamitin pero dapat may due process (notice + hearing). Hindi pwede biglaang tanggal.",

    "category": "Labor & Employment"
  },
  {
    "id": 14,
    "question": "Pwede ba mag-file ng kaso kahit nasa abroad ako?",

    "basis": "Rules of Court Rule 14 Sec. 17",
    "category": "Legal Process"
  },
  {
    "id": 15,
    "question": "Na-leak private pics ko ng ex, ano gagawin ko?",
    "answer": "File cybercrime (unlawful disclosure) or VAWC. Humingi ng takedown sa platform + damages.",
    "basis": "RA 10175; RA 9995; RA 9262",
    "category": "Cybercrime"
  },
  {
    "id": 16,
    "question": "Legit ba \"pay in 4\" sa GCash/Lazada?",

    "category": "General"
  },
  {
    "id": 17,
    "question": "Pwede bang mag-file ng police report online?",
    "answer": "Oo, sa PNP e-blotter or app. Minor cases barangay muna.",
    "basis": "PNP guidelines",
    "category": "Cybercrime"
  },
  {
    "id": 18,
    "question": "Nagpapanggap na pulis humihingi ng pera, ano gagawin?",
    "answer": "Huwag magbigay. Tawagan 117 o punta sa police station. Impersonation crime.",
    "basis": "RPC Art. 177",
    "category": "General"
  },
  {
    "id": 19,
    "question": "60 years old na ako, pwede na mag-retire?",

    "basis": "Labor Code Art. 302; RA 7641",
    "category": "General"
  },
  {
    "id": 20,
    "question": "Ayaw payagan ng boss yung sick leave ko, pwede ba?",

  },
  {
    "id": 21,
    "question": "Na-block ako pero may utang pa siya sakin, paano?",
    "answer": "Magpadala ng demand letter via registered mail. Kung hindi, small claims or collection case.",

  },
  {
    "id": 22,
    "question": "Pwede bang mag-file ng kaso walang lawyer?",

    "category": "Legal Process"
  },
  {
    "id": 23,
    "question": "May life insurance ako, ano mangyayari pag namatay ako?",

    "category": "Tax & Finance"
  },
  {
    "id": 24,
    "question": "Cash advance sa sweldo, bawal ba?",
    "answer": "Pwede kung voluntary at reasonable interest. Hindi pwede pilitin o lampas minimum wage.",

    "category": "Labor & Employment"
  },
  {
    "id": 25,
    "question": "Harassment via text lang, pwede ko ba kasuhan?",

    "category": "Cybercrime"
  },
  {
    "id": 26,
    "question": "May naka-park sa slot ko sa condo, paano?",

  },
  {
    "id": 27,
    "question": "Signed na ang contract, hindi na ba pwede baguhin?",
    "answer": "Pwede kung magkasundo kayo o may fraud/mistake. Pwede ring i-void kung illegal.",

    "category": "Contracts"
  },
  {
    "id": 28,
    "question": "Pwede ko bang kasuhan ang barangay captain?",
    "answer": "Oo — admin complaint sa mayor/Ombudsman. Criminal kung graft.",

  },
  {
    "id": 29,
    "question": "Na-leak medical record ko, ano gagawin?",

  },
  {
    "id": 30,
    "question": "\"No work no pay\" kahit walang pasok dahil bagyo?",

  {
    "id": 31,

  {

  {

  {

  {
    "id": 35,

  },
  {
    "id": 36,

    "answer": "Express or implied warranty of quality.",

  {
    "id": 37,

        const categories = [...new Set(legalQA.map(q => q.category))].sort();

        // Initialize
        function init() {
            populateCategoryDropdown();
            renderQuestions();
            setupEventListeners();
        }

        // Populate dropdown
        function populateCategoryDropdown() {
            const select = document.getElementById('categorySelect');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        // Apply filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            
            filteredQA = legalQA.filter(qa => {
                const matchesSearch = !searchTerm || 
                    qa.question.toLowerCase().includes(searchTerm) ||
                    qa.answer.toLowerCase().includes(searchTerm) ||
                    qa.basis.toLowerCase().includes(searchTerm);
                
                const matchesCategory = !category || qa.category === category;
                
                return matchesSearch && matchesCategory;
            });
            
            currentPage = 1;
            renderQuestions();
        }

        // Render questions
        function renderQuestions() {
            const grid = document.getElementById('questionsGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredQA.slice(start, end);

            if (pageItems.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3>No results found</h3>
                        <p>Try different keywords or select another category</p>
                    </div>
                `;
            } else {
                grid.innerHTML = pageItems.map(qa => `
                    <div class="question-card" data-id="${qa.id}">
                        <div class="question-header">
                            <div class="question-number">#${qa.id}</div>
                            <div class="question-main">
                                <div class="question-text">${qa.question}</div>
                                <div class="question-category">${qa.category}</div>
                            </div>
                            <div class="question-toggle">▼</div>
                        </div>
                        <div class="answer-wrapper">
                            <div class="answer-content">
                                <div class="answer-text">${qa.answer}</div>
                                <div class="legal-basis">
                                    <span class="legal-basis-label">Legal Basis</span>
                                    <div class="legal-basis-text">${qa.basis}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Add click handlers
                document.querySelectorAll('.question-header').forEach(header => {
                    header.addEventListener('click', function() {
                        this.parentElement.classList.toggle('active');
                    });
                });
            }

            updatePagination();
            document.getElementById('resultsCount').textContent = filteredQA.length;
        }

        // Update pagination
        function updatePagination() {
            const totalPages = Math.ceil(filteredQA.length / itemsPerPage);
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = totalPages || 1;
            
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || totalPages === 0;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search with debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(applyFilters, 300);
            });

            // Category dropdown
            document.getElementById('categorySelect').addEventListener('change', applyFilters);

            // Clear filters
            document.getElementById('clearBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('categorySelect').value = '';
                applyFilters();
            });

            // Pagination
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderQuestions();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredQA.length / itemsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderQuestions();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            // Scroll to top
            const scrollBtn = document.getElementById('scrollTopBtn');
            window.addEventListener('scroll', () => {
                scrollBtn.classList.toggle('visible', window.pageYOffset > 300);
            });

            scrollBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // Initialize
        init();
    </script>
</body>
</html>
